name: Release Kapsule
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # A tag pushed without bumping the app version ships a mislabelled build
      # (v2.2.0 contained kapsule_2.1.1). Fail before building anything.
      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          STATUS=0
          check() {
            if [ "$2" != "$TAG_VERSION" ]; then
              echo "::error file=$1::version $2 does not match tag $GITHUB_REF_NAME"
              STATUS=1
            fi
          }
          check kapsule/src-tauri/tauri.conf.json "$(jq -r .version kapsule/src-tauri/tauri.conf.json)"
          check kapsule/package.json "$(jq -r .version kapsule/package.json)"
          check kapsule/src-tauri/Cargo.toml "$(grep -m1 '^version' kapsule/src-tauri/Cargo.toml | cut -d'"' -f2)"
          exit $STATUS

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: kapsule/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Desktop Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node Dependencies
        run: cd kapsule && npm install

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: kapsule
          tagName: ${{ github.ref_name }}
          releaseName: 'Kapsule ${{ github.ref_name }}'
          releaseBody: 'Download the AppImage below to run Kapsule on Linux!'
          releaseDraft: false
          prerelease: false

      - name: Auto-update Nix Flake
        run: |
          DEB_FILE=$(find kapsule/src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "DEB file not found!"
            exit 1
          fi
          
          # Generate SRI Hash natively using OpenSSL
          HASH=$(openssl dgst -sha256 -binary "$DEB_FILE" | openssl base64 -A)
          SRI_HASH="sha256-${HASH}"
          
          # Version the flake by what the .deb actually contains
          APP_VERSION=$(jq -r .version kapsule/src-tauri/tauri.conf.json)

          # Construct the new download URL
          NEW_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$(basename "$DEB_FILE")"
          
          # Switch to main branch to avoid detached HEAD
          git fetch origin main:main
          git checkout main
          
          # Update flake.nix (sed is running on the GitHub Runner, not your local machine)
          sed -i "s|url = \".*\.deb\";|url = \"${NEW_URL}\";|g" flake.nix
          sed -i "s|sha256 = \".*\";|sha256 = \"${SRI_HASH}\";|g" flake.nix
          sed -i "s|version = \".*\";|version = \"${APP_VERSION}\";|g" flake.nix
          
          # Commit and Push back to main
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore: auto-update flake.nix for ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:refs/heads/main
